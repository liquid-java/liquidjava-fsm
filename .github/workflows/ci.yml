name: Parser tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Java 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
          cache: maven

      - name: Run parser tests
        run: mvn --batch-mode --fail-at-end clean test
